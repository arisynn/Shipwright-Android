name: Build Android APK

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: "Gradle build type (release builds arm64-v8a signed with debug key; debug builds all ABIs)"
        required: false
        default: "release"
        type: choice
        options:
          - release
          - debug

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository with submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up OpenJDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Ninja build tool
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ninja-build

      - name: Install Android SDK 31, Build-Tools 30.0.2, and NDK 26.0.10792818
        run: |
          SDK_ROOT="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          echo "ANDROID_HOME=${SDK_ROOT}" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=${SDK_ROOT}" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=${SDK_ROOT}/ndk/26.0.10792818" >> "$GITHUB_ENV"

          SDKMANAGER="${SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" --install \
            "platform-tools" \
            "platforms;android-31" \
            "build-tools;30.0.2" \
            "ndk;26.0.10792818"

      - name: Install CMake 3.31.5
        run: |
          CMAKE_VERSION="3.31.5"
          CMAKE_DIR="${ANDROID_HOME}/cmake/${CMAKE_VERSION}"
          mkdir -p "${CMAKE_DIR}"
          wget -q "https://github.com/Kitware/CMake/releases/download/v${CMAKE_VERSION}/cmake-${CMAKE_VERSION}-linux-x86_64.sh" -O /tmp/cmake.sh
          chmod +x /tmp/cmake.sh
          /tmp/cmake.sh --skip-license --prefix="${CMAKE_DIR}"
          rm -f /tmp/cmake.sh
          ln -sf "$(which ninja)" "${CMAKE_DIR}/bin/ninja"
          echo "${CMAKE_DIR}/bin" >> "$GITHUB_PATH"
          "${CMAKE_DIR}/bin/cmake" --version

      - name: Configure local.properties and build APK
        working-directory: Android
        run: |
          cat > local.properties <<EOF
          sdk.dir=${ANDROID_HOME}
          EOF

          chmod +x gradlew
          if [ "${{ inputs.build_type || 'release' }}" = "debug" ]; then
            ./gradlew assembleDebug --no-daemon --stacktrace
          else
            ./gradlew assembleRelease --no-daemon --stacktrace
          fi

      - name: List generated APKs
        run: |
          find Android/app/build/outputs/apk -type f -name "*.apk" -exec ls -lh {} +

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: shipwright-android-apk
          path: Android/app/build/outputs/apk/**/*.apk
          if-no-files-found: error
